<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桃源寻码 · 场景与学习路径</title></head>
<body><main><section id="world"><canvas id="canvas"></canvas><header><div><small>桃源寻码 · 连续旅程 / R02</small><h1>沿溪，学会创造。</h1><p>让每一段路，都有一个学会的理由。</p></div><span class="seal">桃<br>源</span></header><div id="loading">正在载入桃花山谷…</div><div class="scene-caption"><span id="cameraName">C01 · 溪畔启航</span><span id="metrics">测量场景尺度中</span></div><nav id="cameras" aria-label="固定机位"></nav><div class="tools"><label>动作 <select id="motion"><option value="wave">挥手</option><option value="walk">走路</option><option value="run">跑步</option><option value="nod">点头</option><option value="eat">坐下吃饭 · 候选 1</option><option value="bow">作揖 · 候选 1</option><option value="hop">蹦跳 · 动作测试</option></select></label><button id="pause">暂停风与动作</button><button id="capture">保存当前机位</button></div><p class="disclosure">PINOC 高斯场景与骨骼角色 · 本页为场景验收预览；课程任务尚未接入运行环境。</p></section><aside><div class="path-heading"><small>学习路径 / 14 周</small><h2>从一行代码，<br>到自己的桃源。</h2><p>选择一站，对照场景与学习证据。</p></div><ol id="route"></ol><section id="task"></section><section class="review"><h3>这一轮，差在哪里？</h3><textarea id="notes" aria-label="本轮差距记录" placeholder="目标 → 观察到的差距 → 下一轮修改"></textarea><button id="saveNotes">保存差距记录</button><p id="saved" role="status"></p></section></aside></main><script type="module" src="/src.js"></script></body></html>
